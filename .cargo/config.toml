# Конфигурация сборки проекта.
# Глобальный ~/.cargo/config.toml задаёт panic=abort и target-cpu=native —
# они ломают cargo test и не нужны игре. Здесь перекрываем их
# (позже объявленные флаги rustc побеждают ранние).

[build]
rustflags = []

[target.x86_64-pc-windows-msvc]
rustflags = [
    "-C", "opt-level=3",
    "-C", "panic=unwind",
    "-C", "target-cpu=generic",
]

# WASM-сборка (web): глобальный ~/.cargo/config.toml подкладывает флаги
# (panic=abort, target-cpu=native, inline-threshold), которые к wasm
# неприменимы (inline-threshold удалён из rustc) и ломают сборку.
# Пустой набор cargo игнорирует, поэтому задаём нейтральные флаги явно.
[target.wasm32-unknown-unknown]
rustflags = [
    "-C", "panic=abort",
    "-C", "target-cpu=generic",
]
