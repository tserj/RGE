<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Меню игры — Bevy</title>
    <style>
        /* Холст игры занимает всё окно, фон чёрный — без белых полос */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
            outline: none;
        }
    </style>
</head>
<body>
    <!-- Bevy монтирует <canvas> в body автоматически -->
</body>
</html>
