[package]
name = "game_menu"
version = "0.4.0"
edition = "2021"

[dependencies]
# Игровой движок Bevy: https://github.com/bevyengine/bevy
#
# Фичи собраны вручную вместо default (2d+3d+ui+audio), чтобы не тащить
# в бинарь 3D-рендер, аудиокодеки, загрузчики gltf/текстур и picking —
# для меню это уменьшает web-сборку в разы:
#  * ui_bevy_render  — Bevy UI + рендер (тянет ui_api → bevy_ui, bevy_text,
#    bevy_asset, bevy_log, bevy_state, bevy_input_focus);
#  * bevy_winit, bevy_clipboard, multi_threaded — окно, буфер, потоки;
#  * webgl2 — бэкенд рендера в браузере; x11/wayland — Linux
#    (на Windows/wasm внутренне выключены через cfg).
bevy = { version = "0.20", default-features = false, features = [
    "std",
    "bevy_winit",
    "bevy_clipboard",
    "multi_threaded",
    "ui_bevy_render",
    "webgl2",
    "x11",
    "wayland",
] }

# WASM-сборка (web): источник случайных чисел для браузера
# (см. https://docs.rs/getrandom — без wasm_js он паникует в браузере)
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", default-features = false, features = ["wasm_js"] }

# Windows: MessageBox для критических ошибок
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging"] }

# Ускорение dev-сборки: зависимости оптимизируем, свой код — нет
# (без этого debug-сборка Bevy-игры заметно тормозит)
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Релиз: философия по платформам (см. README):
#  * нативные (Windows/Linux/macOS) — максимальная скорость:
#    opt-level=3 задаётся в .cargo/config.toml (rustflags msvc-таргета);
#  * web (wasm32) — минимальный размер: opt-level=z в rustflags wasm-таргета.
# Общее: один юнит кодогенерации + fat-LTO (ускоряет И уменьшает бинарь);
# strip отладочной информации на скорость не влияет.
[profile.release]
codegen-units = 1
lto = "fat"
strip = "debuginfo"
